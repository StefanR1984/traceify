name: Integration (echt)

# Testet Traceify mit echtem Ollama (KI) und echtem ODA File Converter (DWG) auf Windows.
# Nur manuell starten (Actions -> Integration (echt) -> Run workflow) - der Lauf lädt
# mehrere GB (KI-Modell) und dauert je nach Modell 15-40 Minuten.

on:
  workflow_dispatch:
    inputs:
      modell:
        description: "Ollama-Modell, das getestet wird"
        required: false
        default: "gemma3:4b"
      # kleiner und schneller auf der CPU des Runners: z. B. "qwen2.5vl:3b" oder "moondream"

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: offscreen
  TRACEIFY_ECHT: "1"
  TRACEIFY_MODELL: ${{ github.event.inputs.modell || 'gemma3:4b' }}

jobs:
  echt:
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ollama starten (portables ZIP, ohne Installer)
        timeout-minutes: 10
        run: |
          # Der Windows-Installer startet am Ende die Ollama-App im Infobereich und kehrt
          # dann nie zurück - deshalb das portable ZIP und direkt "ollama serve".
          $zip = "$env:RUNNER_TEMP\ollama.zip"
          $dir = "$env:RUNNER_TEMP\ollama"
          Invoke-WebRequest -Uri "https://github.com/ollama/ollama/releases/latest/download/ollama-windows-amd64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $exe = Get-ChildItem $dir -Recurse -Filter ollama.exe | Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) { throw "ollama.exe nicht im ZIP gefunden" }
          "OLLAMA_EXE=$exe" >> $env:GITHUB_ENV
          Start-Process -FilePath $exe -ArgumentList "serve" -WindowStyle Hidden
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try { Invoke-RestMethod "http://127.0.0.1:11434/api/version" | Out-Host; $ok = $true; break }
            catch { Start-Sleep -Seconds 2 }
          }
          if (-not $ok) { throw "Ollama-Server startet nicht" }

      - name: KI-Modell laden
        timeout-minutes: 20
        run: |
          & $env:OLLAMA_EXE pull $env:TRACEIFY_MODELL
          if ($LASTEXITCODE -ne 0) { throw "Modell konnte nicht geladen werden" }
          & $env:OLLAMA_EXE list

      - name: ODA File Converter installieren
        timeout-minutes: 10
        run: |
          $page = Invoke-WebRequest -Uri "https://www.opendesign.com/guestfiles/oda_file_converter" -UseBasicParsing
          $m = [regex]::Matches($page.Content, "ODAFileConverter_QT6_vc1[0-9]_amd64dll_[0-9.]+\.msi") | Select-Object -ExpandProperty Value -Unique
          if (-not $m) { throw "Kein Download-Link fuer den ODA File Converter gefunden" }
          $name = ($m | Sort-Object)[-1]
          Write-Host "Lade $name"
          $msi = "$env:RUNNER_TEMP\$name"
          Invoke-WebRequest -Uri "https://www.opendesign.com/guestfiles/get?filename=$name" -OutFile $msi
          Start-Process msiexec.exe -ArgumentList "/i", "`"$msi`"", "/qn", "/norestart" -Wait
          Get-ChildItem "C:\Program Files\ODA" -Recurse -Filter ODAFileConverter.exe | Select-Object FullName | Out-Host

      - name: Tests mit echtem Ollama und ODA
        timeout-minutes: 30
        run: python -m pytest -v tests/test_echt.py
