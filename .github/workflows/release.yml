name: Windows-Build

# Baut Traceify.exe (PyInstaller) samt Tesseract OCR und den Windows-Installer (Inno Setup).
# - Manuell (Actions → Windows-Build → Run workflow): Ergebnis als Download unter „Artifacts“
# - Tag v* (z. B. v0.3.0): zusätzlich GitHub-Release mit Setup.exe und portabler ZIP
# - Manuell mit release_tag: Dateien an ein bestehendes Release anhängen

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional: bestehendes Release-Tag (z. B. v0.3.2), an das die Dateien angehängt werden"
        required: false
        default: ""

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
  TESSERACT_URL: https://github.com/tesseract-ocr/tesseract/releases/download/5.5.3/tesseract-ocr-w64-setup-5.5.3.20260724.exe
  TESSDATA_URL: https://github.com/tesseract-ocr/tessdata_fast/raw/main
  PYTHONUTF8: "1"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Version bestimmen
        id: ver
        run: |
          $v = python tools/make_version_info.py
          "version=$v" >> $env:GITHUB_OUTPUT
          if ($env:RELEASE_TAG) {
            $tag = $env:RELEASE_TAG.TrimStart("v", "V", ".")
            if ($tag -ne $v) { throw "Tag $($env:RELEASE_TAG) passt nicht zu __version__ $v in traceify/__init__.py - erwartet wird v$v" }
          }
          Write-Host "Version: $v"

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Tesseract OCR besorgen
        run: |
          $setup = "$env:RUNNER_TEMP\tesseract-setup.exe"
          Invoke-WebRequest -UseBasicParsing $env:TESSERACT_URL -OutFile $setup
          $target = "$env:RUNNER_TEMP\Tesseract-OCR"
          # NSIS: /S = still, /D= muss das letzte Argument sein (ohne Anführungszeichen)
          Start-Process -FilePath $setup -ArgumentList "/S", "/D=$target" -Wait
          if (-not (Test-Path "$target\tesseract.exe")) { throw "Tesseract-Installation fehlgeschlagen" }
          $dest = "packaging\tesseract"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item "$target\*" $dest -Recurse -Force -Exclude "uninstall.exe", "doc", "*.html"
          New-Item -ItemType Directory -Force "$dest\tessdata" | Out-Null
          foreach ($lang in "eng", "deu", "osd") {
            Invoke-WebRequest -UseBasicParsing "$env:TESSDATA_URL/$lang.traineddata" -OutFile "$dest\tessdata\$lang.traineddata"
          }
          & "$dest\tesseract.exe" --version
          & "$dest\tesseract.exe" --list-langs --tessdata-dir "$dest\tessdata"

      - name: Icons erzeugen
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/make_icons.py

      - name: EXE bauen (PyInstaller)
        run: pyinstaller --noconfirm --clean packaging/traceify.spec

      - name: Tesseract neben die EXE legen
        run: |
          Copy-Item packaging\tesseract dist\Traceify\tesseract -Recurse -Force
          if (-not (Test-Path dist\Traceify\tesseract\tesseract.exe)) { throw "Tesseract fehlt im Paket" }
          if (-not (Test-Path dist\Traceify\tesseract\tessdata\deu.traineddata)) { throw "Deutsche OCR-Daten fehlen im Paket" }
          Get-ChildItem dist\Traceify\tesseract | Select-Object -First 8 | Format-Table Name, Length

      - name: EXE-Selbsttest
        run: |
          # Alte Selbsttest-Ordner (z. B. aus pytest) entfernen, sonst wird evtl. das falsche Protokoll gelesen
          Remove-Item "$env:TEMP\traceify_selftest_*" -Recurse -Force -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath "dist\Traceify\Traceify.exe" -ArgumentList "--selbsttest" -Wait -PassThru
          $log = Get-ChildItem "$env:TEMP\traceify_selftest_*\selftest.txt" -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime | Select-Object -Last 1
          if ($log) { Get-Content $log }
          if ($p.ExitCode -ne 0) { throw "Selbsttest der EXE fehlgeschlagen (Exit $($p.ExitCode))" }
          if (-not ($log -and (Get-Content $log) -match "Tesseract: ja")) { throw "Gebündeltes Tesseract wird nicht gefunden" }

      - name: Installer bauen (Inno Setup)
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" packaging\windows\traceify.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup fehlgeschlagen" }

      - name: Portable ZIP
        run: Compress-Archive -Path dist\Traceify -DestinationPath "dist\Traceify-Portable-${{ steps.ver.outputs.version }}.zip"

      - name: Prüfsummen
        run: |
          Get-FileHash dist\*.exe, dist\*.zip -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Set-Content dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Traceify-Windows-${{ steps.ver.outputs.version }}
          path: |
            dist/Traceify-Setup-*.exe
            dist/Traceify-Portable-*.zip
            dist/SHA256SUMS.txt
          retention-days: 30

      - name: Release-Text aus CHANGELOG
        if: env.RELEASE_TAG != ''
        run: python tools/release_notes.py "${{ steps.ver.outputs.version }}" release_notes.md

      - uses: softprops/action-gh-release@v2
        if: env.RELEASE_TAG != ''
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Traceify ${{ steps.ver.outputs.version }}
          body_path: release_notes.md
          files: |
            dist/Traceify-Setup-*.exe
            dist/Traceify-Portable-*.zip
            dist/SHA256SUMS.txt
